<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6fbff"><link rel="manifest" href="manifest.json"><title>Stok Rumah</title>
<style>
:root{--bg:#f6fbff;--card:#fff;--ink:#10244b;--muted:#71809c;--line:#dce8f7;--blue:#1877f2;--safe:#21a366;--warn:#f59e0b;--danger:#ef4444;--shadow:0 8px 24px rgba(39,93,147,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fcff,#eef7ff);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:460px;margin:auto;min-height:100vh;background:rgba(255,255,255,.68);padding-bottom:88px}header{position:sticky;top:0;z-index:15;padding:18px 18px 10px;background:rgba(248,252,255,.93);backdrop-filter:blur(12px)}.head{display:flex;align-items:center;justify-content:space-between}.head h1{margin:0;font-size:29px}.head-icons{display:flex;gap:10px}.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;color:#173b70;display:grid;place-items:center;box-shadow:var(--shadow)}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.screen{display:none;padding:0 18px 24px}.screen.active{display:block}
.hero{display:flex;align-items:center;justify-content:space-between;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#f0f8ff);box-shadow:var(--shadow)}.hero h2{margin:0;color:#1769d2}.house{font-size:52px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.metric{padding:15px 8px;border:1px solid var(--line);border-radius:18px;text-align:center;background:#fff;box-shadow:var(--shadow)}.metric b{display:block;font-size:26px}.metric small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;margin:19px 2px 10px;font-weight:800;font-size:16px}
.summary-card{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px}.summary-card.click{cursor:pointer}.round{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#eef6ff}.grow{flex:1}.summary-card small{color:var(--muted)}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{padding:16px 8px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center;box-shadow:var(--shadow)}.cat .ico{font-size:28px}.cat small{color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 8px}.tab{border:1px solid var(--line);background:#fff;color:#35537b;padding:9px 13px;border-radius:12px;white-space:nowrap}.tab.on{background:var(--blue);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;color:#4c6283}.toolbar select{border:0;background:transparent;color:#1769d2;font-weight:700}.list{display:flex;flex-direction:column;gap:9px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.row-main{cursor:pointer}.row-main b{font-size:15px}.row-main small{display:block;color:var(--muted);margin-top:2px}.row-actions{display:flex;align-items:center;gap:10px}.trash{border:0;background:transparent;color:#9aa8bc;padding:5px}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-left:6px}.safe{background:#eaf8f0;color:var(--safe)}.warn-b{background:#fff4dc;color:#bf7300}.danger-b{background:#ffe9e9;color:#d72f2f}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #bfd2ea;border-radius:18px}.add-wide{width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px;background:var(--blue);color:#fff;font-weight:800}.hist-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:13px;padding:3px;background:#fff;margin-bottom:14px}.hist-tabs button{border:0;border-radius:10px;background:transparent;padding:10px;color:#59708e}.hist-tabs button.on{background:var(--blue);color:#fff}.hist-group h4{color:#1769d2}.hist-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 4px;border-bottom:1px solid #edf2f8}.hist-row small{color:var(--muted)}.in{color:var(--safe)!important;font-weight:800}.out{color:var(--danger)!important;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;z-index:30;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:#536b8a;font-size:11px;display:grid;gap:4px;place-items:center}.nav.on{color:var(--blue);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(20,42,73,.28);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.on{display:flex}.sheet{width:min(460px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px 28px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef4fb;border-radius:12px;width:38px;height:38px}.detail-grid{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fbfdff}.detail-grid div:nth-child(odd){color:#667892}.detail-grid div:nth-child(even){font-weight:700;text-align:right}.controls{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;margin:12px 0}.controls button{border:1px solid var(--line);background:#fff;border-radius:13px;font-size:22px;color:var(--blue)}.controls input{text-align:center;border:1px solid var(--line);border-radius:13px;font-weight:800;font-size:19px;padding:12px}.quick{display:flex;gap:7px;flex-wrap:wrap}.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:#1769d2}.form-grid{display:grid;gap:12px}.field label{display:block;color:#586d8a;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccdced;border-radius:13px;padding:12px;background:#fff}.field textarea{min-height:86px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;gap:9px;margin-top:15px}.primary,.secondary,.danger{border-radius:14px;padding:13px;font-weight:800}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#1769d2}.danger{border:1px solid #ffc4c4;background:#fff7f7;color:var(--danger)}.hidden{display:none!important}
</style></head>
<body><div class="app"><header><div class="head"><h1 id="pageTitle">Beranda</h1><div class="head-icons"><button class="icon-btn" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3"/></svg></button><button class="icon-btn" id="filterBtn"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v5l-4 2v-7z"/></svg></button></div></div></header>
<main>
<section id="home" class="screen active"><div class="hero"><div><h2>Halo, Ibu 👋</h2><small id="todayText"></small></div><div class="house">🏡</div></div><div class="metrics"><div class="metric"><span>📦</span><b id="mTotal">0</b><small>Total Barang</small></div><div class="metric"><span>⚠️</span><b id="mLow">0</b><small>Hampir Habis</small></div><div class="metric"><span>⛔</span><b id="mOut">0</b><small>Habis</small></div></div><div class="section-title">Ringkasan</div><div class="summary-card click" id="goLow"><div class="round">🛒</div><div class="grow"><b id="lowText"></b><small>Klik untuk melihat daftar</small></div><div>›</div></div><div class="summary-card click" id="goExpiry"><div class="round">🗓️</div><div class="grow"><b id="expiryText"></b><small>Klik untuk melihat daftar</small></div><div>›</div></div><div class="section-title">Kategori</div><div class="categories" id="catGrid"></div></section>
<section id="stock" class="screen"><div class="tabs" id="stockTabs"></div><div class="toolbar"><span>Urutkan: <select id="stockSort"><option value="category">Kategori</option><option value="name">Nama</option><option value="low">Stok menipis</option><option value="expiry">Kedaluwarsa</option></select></span><span id="stockCount"></span></div><div class="list" id="stockList"></div><button class="add-wide" id="addStockBtn">Tambah Barang</button></section>
<section id="shop" class="screen"><div class="tabs"><button class="tab on" data-shopfilter="all">Semua</button><button class="tab" data-shopfilter="low">Hampir Habis</button><button class="tab" data-shopfilter="out">Habis</button></div><div class="toolbar"><span>Urutkan: <select id="shopSort"><option value="priority">Prioritas</option><option value="name">Nama</option><option value="category">Kategori</option></select></span></div><div class="section-title"><span>Belum Dibeli</span><span id="shopPending"></span></div><div class="summary-card" style="margin-bottom:12px"><div class="round">💰</div><div class="grow"><b id="shopTotal">Rp 0</b><small>Perkiraan total belanja</small></div></div><div class="list" id="shopList"></div><button class="add-wide" id="addShopBtn">Tambah Belanja</button></section>
<section id="history" class="screen"><div class="hist-tabs"><button id="histShopBtn" class="on">Riwayat Belanja</button><button id="histStockBtn">Riwayat Stok</button></div><div id="historyContent"></div></section>
<section id="more" class="screen"><div class="summary-card"><div class="round">🏠</div><div class="grow"><b>Stok Rumah</b><small>Data tersimpan di perangkat ini</small></div></div><button class="secondary" style="width:100%;margin-top:12px" id="resetDemo">Reset ke Data Contoh</button></section>
</main>
<nav class="bottom"><button class="nav on" data-screen="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Beranda</span></button><button class="nav" data-screen="stock"><svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/></svg><span>Stok</span></button><button class="nav" data-screen="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.5a2 2 0 0 0 2 1.5H18a2 2 0 0 0 2-1.6L21 8H6"/></svg><span>Belanja</span></button><button class="nav" data-screen="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Riwayat</span></button><button class="nav" data-screen="more"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Lainnya</span></button></nav></div><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='stokrumah-v20-data';
const cats=['Dapur','Toilet','Laundry','Obat','Baby Kids','Beauty'],units=['pcs','pack','box','botol','pouch','tube','strip','tablet','kapsul','sachet','gram','kg','ml','L','kaleng'],paoCats=['Beauty','Baby Kids','Obat'],icons={Dapur:'🍲',Toilet:'🧴',Laundry:'🧺',Obat:'🩹','Baby Kids':'🧸',Beauty:'💄'};
const demo={items:[{id:1,name:'Beras',category:'Dapur',qty:1.5,min:2,unit:'kg',expiry:'2026-10-20',location:'Dapur',note:'',opened:'',pao:''},{id:2,name:'Minyak Goreng',category:'Dapur',qty:600,min:1000,unit:'ml',expiry:'2027-02-01',location:'Dapur',note:'',opened:'',pao:''},{id:3,name:'Gula Pasir',category:'Dapur',qty:0,min:1,unit:'kg',expiry:'2027-01-15',location:'Dapur',note:'',opened:'',pao:''},{id:4,name:'Popok M',category:'Baby Kids',qty:18,min:20,unit:'pcs',expiry:'2027-06-01',location:'Lemari Baby',note:'Untuk pemakaian malam',opened:'',pao:''},{id:5,name:'Detergen Bubuk',category:'Laundry',qty:1,min:2,unit:'pouch',expiry:'',location:'Laundry',note:'',opened:'',pao:''},{id:6,name:'Sampo',category:'Beauty',qty:1,min:2,unit:'botol',expiry:'2027-08-01',location:'Kamar mandi',note:'',opened:'2026-08-01',pao:'12M'},{id:7,name:'Paracetamol',category:'Obat',qty:5,min:10,unit:'tablet',expiry:'2026-09-20',location:'Kotak obat',note:'',opened:'',pao:''},{id:8,name:'Pasta Gigi',category:'Toilet',qty:1,min:2,unit:'tube',expiry:'2027-05-01',location:'Kamar mandi',note:'',opened:'',pao:''}],shopping:[],shopHistory:[{id:101,name:'Susu Formula',category:'Baby Kids',qty:1,unit:'kaleng',date:'2026-08-28T19:45:00'}],stockHistory:[{id:201,name:'Popok M',type:'out',qty:2,unit:'pcs',date:'2026-08-29T08:30:00'}]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(demo),stockFilter='all',shopFilter='all',histMode='shop',expiryOnly=false,searchTerm='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),uid=()=>Date.now()+Math.floor(Math.random()*100000);
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function status(x){return +x.qty<=0?'out':+x.qty<=+x.min?'low':'safe'} function badge(x){return status(x)==='safe'?'<span class="badge safe">Aman</span>':status(x)==='low'?'<span class="badge warn-b">Hampir Habis</span>':'<span class="badge danger-b">Habis</span>'}
function fmt(v){return v?new Date(v+'T00:00:00').toLocaleDateString('id-ID'):'-'} function dayDiff(v){if(!v)return 99999;let d=new Date(v+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function paoLimit(x){if(!x.opened||!x.pao)return '';let d=new Date(x.opened+'T00:00:00');d.setMonth(d.getMonth()+parseInt(x.pao));return d.toISOString().slice(0,10)} function effExp(x){return [x.expiry,paoLimit(x)].filter(Boolean).sort()[0]||''}
function syncShopping(){data.items.forEach(x=>{if(status(x)!=='safe'){let s=data.shopping.find(y=>y.stockId===x.id);if(!s)data.shopping.push({id:uid(),stockId:x.id,name:x.name,category:x.category,qty:1,unit:x.unit,priority:status(x)==='out'?'Tinggi':'Sedang',price:0,expiry:'',note:'',auto:true});else{s.name=x.name;s.category=x.category}}});save()}
function go(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav').forEach(x=>x.classList.toggle('on',x.dataset.screen===id));$('#pageTitle').textContent={home:'Beranda',stock:'Stok',shop:'Belanja',history:'Riwayat',more:'Lainnya'}[id];$('#searchBtn').style.display=['stock','shop'].includes(id)?'grid':'none';$('#filterBtn').style.display=['stock','shop'].includes(id)?'grid':'none';render()}
function render(){syncShopping();renderHome();renderStockTabs();renderStock();renderShop();renderHistory()}
function renderHome(){let low=data.items.filter(x=>status(x)==='low').length,out=data.items.filter(x=>status(x)==='out').length,exp=data.items.filter(x=>{let d=dayDiff(effExp(x));return d>=0&&d<=30}).length;$('#mTotal').textContent=data.items.length;$('#mLow').textContent=low;$('#mOut').textContent=out;$('#lowText').textContent=`${low+out} barang hampir habis / habis`;$('#expiryText').textContent=`${exp} barang hampir kedaluwarsa`;$('#catGrid').innerHTML=cats.map(c=>`<div class="cat" data-cat="${c}"><div class="ico">${icons[c]}</div><b>${c}</b><small>${data.items.filter(x=>x.category===c).length} barang</small></div>`).join('');$$('[data-cat]').forEach(b=>b.onclick=()=>{stockFilter=b.dataset.cat;expiryOnly=false;go('stock')})}
function renderStockTabs(){$('#stockTabs').innerHTML=['all',...cats].map(c=>`<button class="tab ${stockFilter===c?'on':''}" data-sf="${c}">${c==='all'?'Semua':c}</button>`).join('');$$('[data-sf]').forEach(b=>b.onclick=()=>{stockFilter=b.dataset.sf;expiryOnly=false;renderStockTabs();renderStock()})}
function renderStock(){let a=[...data.items];if(stockFilter!=='all')a=a.filter(x=>x.category===stockFilter);if(expiryOnly)a=a.filter(x=>{let d=dayDiff(effExp(x));return d>=0&&d<=30});if(searchTerm)a=a.filter(x=>x.name.toLowerCase().includes(searchTerm.toLowerCase()));let s=$('#stockSort').value;a.sort((x,y)=>s==='name'?x.name.localeCompare(y.name):s==='low'?(x.qty-x.min)-(y.qty-y.min):s==='expiry'?effExp(x).localeCompare(effExp(y)):x.category.localeCompare(y.category));$('#stockCount').textContent=`${a.length} barang`;$('#stockList').innerHTML=a.length?a.map(x=>`<div class="row"><div class="row-main" data-stock="${x.id}"><b>${esc(x.name)}</b>${badge(x)}<small>${x.qty} ${x.unit} | Min. ${x.min} ${x.unit}${effExp(x)?` | Exp ${fmt(effExp(x))}`:''}</small></div><div class="row-actions"><span>›</span><button class="trash" data-delstock="${x.id}">🗑️</button></div></div>`).join(''):'<div class="empty">Belum ada barang.</div>';$$('[data-stock]').forEach(e=>e.onclick=()=>openStockDetail(+e.dataset.stock));$$('[data-delstock]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();deleteStock(+e.dataset.delstock)})}
function renderShop(){let a=[...data.shopping];if(shopFilter==='low')a=a.filter(x=>{let s=data.items.find(i=>i.id===x.stockId);return s&&status(s)==='low'});if(shopFilter==='out')a=a.filter(x=>{let s=data.items.find(i=>i.id===x.stockId);return s&&status(s)==='out'});if(searchTerm)a=a.filter(x=>x.name.toLowerCase().includes(searchTerm.toLowerCase()));$('#shopPending').textContent=`${a.length} item`;$('#shopTotal').textContent='Rp '+a.reduce((t,x)=>t+(Number(x.price)||0)*(Number(x.qty)||0),0).toLocaleString('id-ID');$('#shopList').innerHTML=a.length?a.map(x=>{let st=data.items.find(i=>i.id===x.stockId);return `<div class="row"><div class="row-main" data-shop="${x.id}"><b>${esc(x.name)}</b><small>${x.qty} ${x.unit} | ${x.category}${x.price?` | Rp ${Number(x.price).toLocaleString('id-ID')}`:''}${st?` | Stok ${st.qty}/${st.min} ${st.unit}`:''}${x.expiry?` | Exp ${fmt(x.expiry)}`:''}</small></div><div class="row-actions"><span>›</span><button class="trash" data-delshop="${x.id}">🗑️</button></div></div>`}).join(''):'<div class="empty">Daftar belanja kosong.</div>';$$('[data-shop]').forEach(e=>e.onclick=()=>openShopEdit(+e.dataset.shop));$$('[data-delshop]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();deleteShop(+e.dataset.delshop)})}
function renderHistory(){let a=histMode==='shop'?data.shopHistory:data.stockHistory;$('#historyContent').innerHTML=a.length?a.slice().reverse().map(h=>histMode==='shop'?`<div class="hist-row"><div><b>${h.name}</b><small>${h.qty} ${h.unit} · ${h.category}${h.price?` · Rp ${Number(h.price).toLocaleString('id-ID')}`:''}</small></div><small>${new Date(h.date).toLocaleString('id-ID')}</small></div>`:`<div class="hist-row"><div><b>${h.name}</b><small class="${h.type==='in'?'in':'out'}">${h.type==='in'?'Stok Masuk':'Stok Keluar'} ${h.type==='in'?'+':'-'}${h.qty} ${h.unit}</small></div><small>${new Date(h.date).toLocaleString('id-ID')}</small></div>`).join(''):'<div class="empty">Belum ada riwayat.</div>'}
function openOverlay(h){$('#sheet').innerHTML=h;$('#overlay').classList.add('on')} function closeOverlay(){$('#overlay').classList.remove('on')}
function stockFields(x={}){let c=x.category||'Dapur';return `<div class="form-grid"><div class="field"><label>Nama Barang</label><input id="fName" value="${esc(x.name||'')}"></div><div class="field"><label>Kategori</label><select id="fCat">${cats.map(v=>`<option ${v===c?'selected':''}>${v}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Jumlah Stok</label><input id="fQty" type="number" step="any" value="${x.qty??0}"></div><div class="field"><label>Jumlah Minimum</label><input id="fMin" type="number" step="any" value="${x.min??0}"></div></div><div class="field"><label>Satuan</label><select id="fUnit">${units.map(v=>`<option ${v===(x.unit||'pcs')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Lokasi</label><input id="fLoc" value="${esc(x.location||'')}"></div><div class="field"><label>Kedaluwarsa</label><input id="fExp" type="date" value="${x.expiry||''}"></div><div id="paoBox" class="${paoCats.includes(c)?'':'hidden'}"><div class="two"><div class="field"><label>Tanggal Dibuka</label><input id="fOpened" type="date" value="${x.opened||''}"></div><div class="field"><label>PAO</label><select id="fPao"><option value="">-</option>${['3M','6M','12M','18M','24M','36M'].map(v=>`<option ${v===x.pao?'selected':''}>${v}</option>`).join('')}</select></div></div></div><div class="field"><label>Keterangan</label><textarea id="fNote">${esc(x.note||'')}</textarea></div></div>`}
function openStockDetail(id){let x=data.items.find(i=>i.id===id);openOverlay(`<div class="sheet-head"><h2>${x.name}</h2><button class="close" onclick="closeOverlay()">✕</button></div><div class="detail-grid"><div>Jumlah Stok</div><div>${x.qty} ${x.unit}</div><div>Jumlah Minimum</div><div>${x.min} ${x.unit}</div><div>Kategori</div><div>${x.category}</div><div>Lokasi</div><div>${x.location||'-'}</div><div>Keterangan</div><div>${x.note||'-'}</div><div>Kedaluwarsa</div><div>${fmt(x.expiry)}</div>${paoCats.includes(x.category)?`<div>Tanggal Dibuka</div><div>${fmt(x.opened)}</div><div>PAO</div><div>${x.pao||'-'}</div><div>Batas Pakai Setelah Dibuka</div><div>${fmt(paoLimit(x))}</div>`:''}</div><div class="controls"><button id="minus">−</button><input id="q" value="1" type="number"><button id="plus">+</button></div><div class="actions"><button class="secondary" id="edit">Edit Detail</button><button class="danger" id="del">Hapus dari Stok</button></div>`);$('#minus').onclick=()=>adjustStock(id,-(+$('#q').value||1));$('#plus').onclick=()=>adjustStock(id,(+$('#q').value||1));$('#edit').onclick=()=>openStockForm(id);$('#del').onclick=()=>deleteStock(id)}
function adjustStock(id,d){let x=data.items.find(i=>i.id===id),old=x.qty;x.qty=Math.max(0,+(x.qty+d).toFixed(3));let a=x.qty-old;if(a)data.stockHistory.push({id:uid(),name:x.name,type:a>0?'in':'out',qty:Math.abs(a),unit:x.unit,date:new Date().toISOString()});save();closeOverlay();render()}
function openStockForm(id){let x=id?data.items.find(i=>i.id===id):null;openOverlay(`<div class="sheet-head"><h2>${x?'Edit Stok':'Tambah Barang'}</h2><button class="close" onclick="closeOverlay()">✕</button></div>${stockFields(x||{})}<div class="actions"><button class="primary" id="saveStock">Simpan</button></div>`);$('#fCat').onchange=()=>$('#paoBox').classList.toggle('hidden',!paoCats.includes($('#fCat').value));$('#saveStock').onclick=()=>{let o={id:x?.id||uid(),name:$('#fName').value.trim(),category:$('#fCat').value,qty:+$('#fQty').value||0,min:+$('#fMin').value||0,unit:$('#fUnit').value,location:$('#fLoc').value,expiry:$('#fExp').value,opened:$('#fOpened')?.value||'',pao:$('#fPao')?.value||'',note:$('#fNote').value};if(!o.name)return alert('Nama barang belum diisi');if(x){let old=x.qty;Object.assign(x,o);let d=x.qty-old;if(d)data.stockHistory.push({id:uid(),name:x.name,type:d>0?'in':'out',qty:Math.abs(d),unit:x.unit,date:new Date().toISOString()})}else{data.items.push(o);if(o.qty)data.stockHistory.push({id:uid(),name:o.name,type:'in',qty:o.qty,unit:o.unit,date:new Date().toISOString()})}save();closeOverlay();render()}}
function deleteStock(id){let x=data.items.find(i=>i.id===id);if(confirm(`Hapus ${x.name} dari stok?`)){data.items=data.items.filter(i=>i.id!==id);data.shopping=data.shopping.filter(s=>s.stockId!==id);save();closeOverlay();render()}}
function openShopEdit(id){let x=data.shopping.find(i=>i.id===id),st=data.items.find(i=>i.id===x.stockId);openOverlay(`<div class="sheet-head"><h2>Edit Belanja</h2><button class="close" onclick="closeOverlay()">✕</button></div><div class="form-grid"><div class="field"><label>Nama Barang</label><input id="sName" value="${x.name}"></div><div class="field"><label>Kategori</label><select id="sCat">${cats.map(v=>`<option ${v===x.category?'selected':''}>${v}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Jumlah</label><input id="sQty" type="number" value="${x.qty}"></div><div class="field"><label>Satuan</label><select id="sUnit">${units.map(v=>`<option ${v===x.unit?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Harga (opsional)</label><input id="sPrice" type="number" min="0" step="100" value="${x.price||''}" placeholder="Contoh: 25000"></div><div class="field"><label>Kedaluwarsa</label><input id="sExp" type="date" value="${x.expiry||''}"></div><div class="field"><label>Catatan</label><textarea id="sNote">${x.note||''}</textarea></div>${st&&st.unit!==x.unit?`<div class="field"><label>1 ${x.unit} = berapa ${st.unit}</label><input id="sConv" type="number" value="1"></div>`:''}</div><div class="actions"><button class="secondary" id="saveShop">Simpan Perubahan</button><button class="primary" id="bought">Tandai Sudah Dibeli</button><button class="danger" id="delShop">Hapus dari Daftar Belanja</button></div>`);$('#saveShop').onclick=()=>{Object.assign(x,{name:$('#sName').value,category:$('#sCat').value,qty:+$('#sQty').value||0,unit:$('#sUnit').value,price:+$('#sPrice').value||0,expiry:$('#sExp').value,note:$('#sNote').value});save();closeOverlay();render()};$('#bought').onclick=()=>markBought(id);$('#delShop').onclick=()=>deleteShop(id)}
function addShop(){data.shopping.push({id:uid(),stockId:null,name:'Item Baru',category:'Dapur',qty:1,unit:'pcs',price:0,priority:'Sedang',expiry:'',note:''});save();render();openShopEdit(data.shopping.at(-1).id)}
function markBought(id){let x=data.shopping.find(i=>i.id===id),st=data.items.find(i=>i.id===x.stockId)||data.items.find(i=>i.name.toLowerCase()===x.name.toLowerCase());if(st){let add=x.qty;if(st.unit!==x.unit){let c=+($('#sConv')?.value||prompt(`1 ${x.unit} berisi berapa ${st.unit}?`));if(!c)return;add*=c}st.qty+=add;if(x.expiry)st.expiry=x.expiry;data.stockHistory.push({id:uid(),name:st.name,type:'in',qty:add,unit:st.unit,date:new Date().toISOString()})}else{st={id:uid(),name:x.name,category:x.category,qty:x.qty,min:0,unit:x.unit,expiry:x.expiry,location:'',note:x.note,opened:'',pao:''};data.items.push(st);data.stockHistory.push({id:uid(),name:st.name,type:'in',qty:st.qty,unit:st.unit,date:new Date().toISOString()})}data.shopHistory.push({id:uid(),name:x.name,category:x.category,qty:x.qty,unit:x.unit,price:x.price||0,date:new Date().toISOString()});data.shopping=data.shopping.filter(i=>i.id!==id);save();closeOverlay();render()}
function deleteShop(id){let x=data.shopping.find(i=>i.id===id);if(confirm(`Hapus ${x.name} dari daftar belanja?`)){data.shopping=data.shopping.filter(i=>i.id!==id);save();closeOverlay();render()}}
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.screen));$('#addStockBtn').onclick=()=>openStockForm();$('#addShopBtn').onclick=addShop;$('#stockSort').onchange=renderStock;$$('[data-shopfilter]').forEach(b=>b.onclick=()=>{shopFilter=b.dataset.shopfilter;$$('[data-shopfilter]').forEach(x=>x.classList.toggle('on',x===b));renderShop()});$('#histShopBtn').onclick=()=>{histMode='shop';$('#histShopBtn').classList.add('on');$('#histStockBtn').classList.remove('on');renderHistory()};$('#histStockBtn').onclick=()=>{histMode='stock';$('#histStockBtn').classList.add('on');$('#histShopBtn').classList.remove('on');renderHistory()};$('#goLow').onclick=()=>go('shop');$('#goExpiry').onclick=()=>{expiryOnly=true;stockFilter='all';go('stock')};$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeOverlay()};$('#searchBtn').onclick=()=>{let v=prompt('Cari barang:',searchTerm);if(v!==null){searchTerm=v;render()}};$('#filterBtn').onclick=()=>alert('Gunakan kategori dan Urutkan untuk memfilter.');$('#resetDemo').onclick=()=>{data=structuredClone(demo);save();render()};$('#todayText').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});go('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
